# 依赖更新提醒：每月一次、按组合并成一个 PR，不要每个包一条。
# remotion 三个包 + react 两个包各自必须同版本升，分组正是为了这个。
# 不想要了直接删这个文件即可。
# 大版本升级（如 vite 8 / TypeScript 7）会让构建挂——那种 PR 关掉、单独适配，别在机器人 PR 里改代码。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      remotion: { patterns: ["remotion", "@remotion/*"] }
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
      build-tools: { patterns: ["vite", "@vitejs/*", "typescript", "concurrently"] }
      runtime: { patterns: ["express", "cors", "multer", "zod", "msedge-tts", "agency-orchestrator"] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      electron: { patterns: ["electron", "electron-builder"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    # 9-14 首跑没分组，5 个 action 各开一个 PR；分组后同一次升级只开一个
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
