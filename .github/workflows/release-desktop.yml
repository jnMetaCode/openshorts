name: Release Desktop App

# 手动触发或推 desktop-v* tag：三平台各自构建桌面安装包并上传到对应 GitHub Release。
# mac 出 arm64 + x64 两个 dmg / win exe / linux AppImage。
# 未签名版（desktop/package.json 里 mac.identity=null）；要启用 mac 签名/公证，
# 在仓库 Secrets 加 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID 即自动切换（electron-builder.config.cjs 按有无证书动态选路）。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. desktop-v0.1.0)"
        required: true
        default: "desktop-v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder_flag: "--mac --arm64 --x64"
            plat: mac
          - os: windows-latest
            builder_flag: "--win"
            plat: win
          - os: ubuntu-latest
            builder_flag: "--linux"
            plat: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps & build UI (dist/)
        run: |
          npm ci
          npm run build

      # 瘦身：typescript/@types/vite 等纯构建期依赖 ~40M+，dist 已编译、运行时用不到。
      # 删包后必须清 .bin 悬空符号链接——打进 mac 包会让 codesign --deep --strict 失败
      # （AO 0.4.5 的 mac 构建就死在这）。
      - name: Slim node_modules for packaging
        shell: bash
        run: |
          rm -rf node_modules/typescript node_modules/@types node_modules/vite node_modules/@vitejs node_modules/concurrently node_modules/@remotion/cli
          for f in node_modules/.bin/*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then rm "$f"; echo "removed dangling: $f"; fi
          done

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder_flag }} --config electron-builder.config.cjs --publish never
        env:
          # CSC_LINK 只给 macOS：Windows 签名会兜底读 CSC_LINK，Apple 证书会把它带炸
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 闸：确认界面产物真的被打进包（缺了就是白屏包，绝不发）
      #
      # 必须用 -ipath 而不是 -path：mac 的 .app 里是 Contents/**Resources**（大写 R），
      # win/linux 是 resources/（小写）。写死小写的话这道闸在 mac 上永远匹配不到——
      # 第一次推 desktop-v0.1.0 时就是这么把一个**界面完好**的 mac 包judged成白屏包拒发的
      # （win/linux 反而顺利通过）。也就是说这道闸在 mac 上从来没真正生效过。
      - name: Verify UI landed in packaged app
        shell: bash
        run: |
          found=$(find desktop/release -ipath "*resources/app/dist/index.html" | head -1)
          if [ -z "$found" ]; then
            echo "::error::resources/app/dist/index.html 不在包里——白屏包，拒发"
            echo "--- desktop/release 里实际有的 index.html ---"
            find desktop/release -iname index.html | head -20
            exit 1
          fi
          echo "UI in package: $found"

      # 先把产物名规范成 ASCII,再算校验和。
      # 不做这一步的话:electron-builder 出的是「开片 OpenShorts-0.1.0-arm64.dmg」,
      # 而 GitHub 上传时会把中文前缀和空格改掉(变成 OpenShorts-0.1.0-arm64.dmg),
      # 于是 SHA256SUMS 里记的文件名和用户下到的对不上——照常规 `shasum -c` 校验会看到
      # FAILED open or read,一个完好的安装包被报成"可能被篡改",比不给校验和更糟。
      # (desktop-v0.1.0 首发就是这样,下下来实测过。)
      - name: Normalize artifact names (ASCII)
        shell: bash
        working-directory: desktop/release
        run: |
          shopt -s nullglob
          for f in *.dmg *.exe *.AppImage; do
            n=$(printf '%s' "$f" | LC_ALL=C sed 's/[^ -~]//g' | sed 's/^ *//; s/ *$//' | tr ' ' '.' | sed 's/\.\.*/./g')
            if [ -n "$n" ] && [ "$f" != "$n" ]; then mv -- "$f" "$n"; echo "renamed: $f -> $n"; fi
          done

      - name: Generate checksums
        shell: bash
        working-directory: desktop/release
        run: |
          shopt -s nullglob
          files=( *.dmg *.exe *.AppImage )
          if [ ${#files[@]} -gt 0 ]; then
            if command -v sha256sum >/dev/null 2>&1; then HASH="sha256sum"; else HASH="shasum -a 256"; fi
            $HASH "${files[@]}" > "SHA256SUMS-${{ matrix.plat }}.txt"
            cat "SHA256SUMS-${{ matrix.plat }}.txt"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/SHA256SUMS-*.txt
          generate_release_notes: true
